# The development stack: server + Postgres + one runner.
#
#   make dev
#
# On startup the server seeds a development org, a well-known registration
# token, and a demo job, so the runner enrolls itself and you can watch
# `echo hello` travel the whole path with no manual bootstrap.
#
# Nothing here is suitable for production: the database password is in this
# file, the runner connects without TLS, and the registration token is a
# constant published in a public repository.

name: cicado

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cicado
      POSTGRES_PASSWORD: cicado
      POSTGRES_DB: cicado
    ports:
      # Exposed so you can psql into it while the stack runs.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cicado -d cicado"]
      interval: 2s
      timeout: 3s
      retries: 30
    # fsync off: this database is a development scratchpad, and durability buys
    # nothing while costing noticeable wall time on every test run.
    command: >
      postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off

  server:
    build:
      context: .
      target: server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CICADO_DATABASE_URL: postgres://cicado:cicado@postgres:5432/cicado?sslmode=disable
      CICADO_HTTP_ADDR: ":8080"
      CICADO_GRPC_ADDR: ":8081"
      CICADO_LOG_LEVEL: debug
      CICADO_MIGRATE: "true"
      CICADO_DEV_SEED: "true"
      # Development only: the dev-seed produces runs without a real webhook
      # HMAC secret, so opt into the explicitly-loud, non-secure dev path
      # (CIC-80). Absent this flag the server refuses to start because a
      # missing secret is no longer accepted silently.
      CICADO_INSECURE_WEBHOOK: "true"
    ports:
      - "8080:8080"
      - "8081:8081"
    # Only asserts Postgres is reachable over HTTP on :8080; it does not check
    # the gRPC listener on :8081 the runner actually dials. In practice this
    # doesn't need its own healthcheck: both listeners come up in the same
    # process at the same time, and the runner's own reconnect/backoff loop
    # (runner/agent.go) covers the gap if it briefly loses the race anyway.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/readyz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  runner:
    build:
      context: .
      target: runner
    depends_on:
      server:
        condition: service_healthy
    # No healthcheck: the runner has no HTTP listener to poll (it only dials
    # out). If it crashes mid-dev-session, `docker compose ps` shows it exited
    # rather than "unhealthy" — check there, or the logs, if the demo job
    # stops progressing.
    environment:
      CICADO_SERVER: server:8081
      # Matches DevRegistrationToken in server/cmd/cicado-server/devseed.go.
      CICADO_REGISTRATION_TOKEN: cicado_reg_Y2ljYWRvLWRldmVsb3BtZW50LXRva2VuLURPLU5PVCE
      CICADO_RUNNER_NAME: dev-runner
      CICADO_RUNNER_STATE: /var/lib/cicado/runner.json
      CICADO_WORKSPACE_ROOT: /var/lib/cicado/workspaces
      CICADO_EXECUTORS: shell,cicanscript
      CICADO_LOG_LEVEL: debug
      # Development only. The protocol is gRPC over TLS with no plaintext
      # fallback; the runner refuses to start without this flag set explicitly.
      CICADO_INSECURE: "true"
    volumes:
      - runner-state:/var/lib/cicado

volumes:
  postgres-data:
  runner-state:
