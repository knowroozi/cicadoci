version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - copyloopvar
    - errorlint
    - goconst
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    generated: lax
    rules:
      # Generated protobuf code is not ours to lint.
      - path: "proto/runner/v1/"
        linters: [ all ]
      # Table-driven tests get long and repetitive on purpose.
      - path: "_test\\.go"
        linters: [ goconst, errcheck ]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - cicadoci.com/cicado
