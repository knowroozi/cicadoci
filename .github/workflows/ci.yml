# Bootstrap CI. This runs on GitHub Actions until CICaDo can run its own builds,
# at which point it moves onto itself (M3 dogfood, CIC-29).

name: CI

on:
  push:
    branches: [master]
  pull_request:

# A new push supersedes an in-flight run on the same ref. Cancelling on master
# is off, so every commit that lands keeps a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Fail rather than silently fetch a newer toolchain. Without this, a go.mod
  # `go` directive above GO_VERSION is invisible here — the runner just
  # downloads what it needs — while the Docker build, which pins
  # GOTOOLCHAIN=local, fails. That exact mismatch shipped once already, is why
  # this guard exists, and is also why GO_VERSION itself is not 1.24: 1.24 was
  # never a chosen floor, just whatever toolchain happened to be on the
  # machine that first ran `go mod init`. 1.26 is current as of this writing."
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build and vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Check both modules are tidy
        # Via make, so the per-module toolchain rules live in one place rather
        # than being duplicated (and drifting) here.
        run: |
          make tidy
          if ! git diff --quiet -- go.mod go.sum tools/go.mod tools/go.sum; then
            echo "::error::go.mod or go.sum is not tidy. Run 'make tidy' and commit the result."
            git --no-pager diff -- go.mod go.sum tools/go.mod tools/go.sum
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install pinned tooling
        run: make dev-deps
      - run: ./bin/golangci-lint run ./... --timeout 5m

  test:
    name: Test (race)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cicado
          POSTGRES_PASSWORD: cicado
          POSTGRES_DB: cicado_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cicado"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Set, so database tests run rather than skipping. A CI run that silently
      # skipped the queue and protocol tests would be worse than no CI.
      CICADO_TEST_DATABASE_URL: postgres://cicado:cicado@localhost:5432/cicado_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run tests with the race detector
        run: go test ./... -race -count=1 -timeout 15m
      - name: Fail if database tests were skipped
        run: |
          # The queue and end-to-end tests are the ones that would actually
          # catch a regression in the queue or the wire protocol. If the
          # database was unreachable they skip quietly, and CI would go green
          # having tested almost nothing. Assert they really ran.
          output=$(go test ./server/queue/ ./test/e2e/ -count=1 -v 2>&1) || {
            echo "$output"
            exit 1
          }
          if grep -q "SKIP" <<<"$output"; then
            echo "::error::Database-backed tests skipped; CICADO_TEST_DATABASE_URL is not reaching Postgres."
            grep "SKIP" <<<"$output"
            exit 1
          fi

  proto:
    name: Protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking compares against the base branch, which needs history.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install pinned tooling
        run: make dev-deps
      - name: Lint the proto
        run: ./bin/buf lint
      - name: Check generated code is up to date
        run: make generate-check
      - name: Reject breaking protocol changes
        # The runner protocol is frozen (ADR-004): additive changes only. This
        # is the check that enforces it, rather than trusting review to catch a
        # renumbered field.
        run: |
          git fetch origin master --depth=1 || true
          make proto-breaking

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
